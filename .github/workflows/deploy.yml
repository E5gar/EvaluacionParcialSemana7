name: Deploy GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Dependencias
        run: npm ci

      - name: Ajustar ruta base del router
        run: |
          sed -i 's|<BrowserRouter>|<BrowserRouter basename={import.meta.env.BASE_URL}>|' src/App.tsx
          grep -q 'basename={import.meta.env.BASE_URL}' src/App.tsx

      - name: Compilar
        run: npx vite build --base=/${{ github.event.repository.name }}/

      - name: Soporte de rutas internas
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
